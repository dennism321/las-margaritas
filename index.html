<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Las Margaritas Mexican Restaurant in Milford, CT — the true taste of Mexico with genuine ingredients and vibrant flavors. 501 New Haven Ave · (203) 878-1910." />
    <meta name="theme-color" content="#0a0807" />
    <meta property="og:title" content="Las Margaritas · Mexican Restaurant · Milford, CT" />
    <meta property="og:description" content="Authentic Mexican food, never Tex-Mex. Family recipes, fresh seafood, sizzling fajitas, and refreshing margaritas at 501 New Haven Ave, Milford." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0807'/%3E%3Ctext x='32' y='44' font-family='Georgia, serif' font-size='34' font-style='italic' fill='%23f0bf4f' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
    <title>Las Margaritas · Mexican Restaurant · Milford, CT</title>

    <!-- Fonts load in the background so they never hold up the first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" /></noscript>

    <link rel="preload" as="image" href="images/logo.webp" />
    <link rel="preload" as="image" href="images/hero-margarita.webp" fetchpriority="high" />

    <script>
      // Scroll-reveal animations only on larger screens. If the app script never
      // starts (offline, blocked), drop the class so nothing stays hidden.
      if (matchMedia("(min-width: 768px) and (prefers-reduced-motion: no-preference)").matches) {
        document.documentElement.classList.add("reveal-on");
        setTimeout(function () {
          if (!window.__lmReady) document.documentElement.classList.remove("reveal-on");
        }, 4000);
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
