    <title>Las Margaritas · Mexican Restaurant · Milford, CT</title>

    <link rel="preload" as="font" type="font/woff2" href="fonts/manrope.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/fraunces.woff2" crossorigin />

    <link rel="preload" as="image" href="images/logo.webp" />
    <link rel="preload" as="image" href="images/hero-margarita.webp" fetchpriority="high" />

    <script>
      // Scroll-reveal animations only on larger screens. If the app script never
      // starts (offline, blocked), drop the class so nothing stays hidden.
      if (matchMedia("(min-width: 768px) and (prefers-reduced-motion: no-preference)").matches) {
        document.documentElement.classList.add("reveal-on");
        setTimeout(function () {
          if (!window.__lmReady) document.documentElement.classList.remove("reveal-on");
        }, 4000);
      }
    </script>
    <script>
      // ?timing shows a load-time readout (see public/timing.js)
      if (/[?&]timing\b/.test(location.search)) {
        var t = document.createElement("script");
        t.src = "timing.js";
        document.head.appendChild(t);
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
