<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Las Margaritas Mexican Restaurant & Cantina in Milford, CT. Sizzling fajitas, birria, enchiladas and margaritas. See the full menu, hours and location."
    />
    <meta name="theme-color" content="#d9301a" />
    <title>Las Margaritas Mexican Restaurant &amp; Cantina | Milford, CT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23d9301a'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%8D%B9%3C/text%3E%3C/svg%3E" />
    <link rel="preload" as="font" type="font/woff2" href="fonts/dmsans.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/fraunces.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="fonts/fraunces-italic.woff2" crossorigin />
    <link rel="preload" as="image" href="images/logo-las-margaritas-384.webp" />

    <script>
      // Scroll-reveal animations only on larger screens. If the app script never
      // starts (offline, blocked), drop the class so nothing stays hidden.
      if (matchMedia("(min-width: 768px) and (prefers-reduced-motion: no-preference)").matches) {
        document.documentElement.classList.add("reveal-on");
        setTimeout(function () {
          if (!window.__lmReady) document.documentElement.classList.remove("reveal-on");
        }, 4000);
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
